name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stage:
    name: Validate (${{ matrix.stage }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stage:
          - markdown
          - rust
          - python
          - typescript
          - go
          - java
          - dotnet
          - conformance

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install required tooling
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.stage }}
          cache-bin: "false"

      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Validate ${{ matrix.stage }}
        run: cargo validate ${{ matrix.stage }}

  validate:
    name: Validate
    needs: stage
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every validation stage to pass
        env:
          RESULT: ${{ needs.stage.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::One or more validation stages finished with: $RESULT"
            exit 1
          fi
