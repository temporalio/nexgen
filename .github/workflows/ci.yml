name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6255b92812bf51d292e488b61469267a391267f6 # stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"

      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: samples/python

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            samples/typescript/package-lock.json
            advanced/samples/typescript/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: samples/go/go.mod
          cache-dependency-path: |
            samples/go/go.sum
            advanced/samples/go/go.sum

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install Python dependencies (samples)
        working-directory: samples/python
        run: uv sync --locked

      - name: Install Python dependencies (advanced)
        working-directory: advanced/samples/python
        run: uv sync --locked

      - name: Install TypeScript dependencies (samples)
        working-directory: samples/typescript
        run: npm ci

      - name: Install TypeScript dependencies (advanced)
        working-directory: advanced/samples/typescript
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --features advanced

      - name: Check Python formatting (samples)
        working-directory: samples/python
        run: uv run ruff format --check .

      - name: Check Python formatting (advanced)
        working-directory: advanced/samples/python
        run: uv run ruff format --check .

      - name: Check TypeScript formatting (samples)
        working-directory: samples/typescript
        run: npm exec -- prettier --check .

      - name: Check TypeScript formatting (advanced)
        working-directory: advanced/samples/typescript
        run: npm exec -- prettier --check .

      - name: Type-check TypeScript (samples)
        working-directory: samples/typescript
        run: npm run typecheck

      - name: Type-check TypeScript (advanced)
        working-directory: advanced/samples/typescript
        run: npm run typecheck

      - name: Run TypeScript tests (samples)
        working-directory: samples/typescript
        run: npm run test

      - name: Run TypeScript tests (advanced)
        working-directory: advanced/samples/typescript
        run: npm run test

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l samples/go advanced/samples/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Run Go tests (samples)
        working-directory: samples/go
        run: go test ./...

      - name: Run Go tests (advanced)
        working-directory: advanced/samples/go
        run: go test ./...

      - name: Run Python tests (samples)
        working-directory: samples/python
        run: uv run pytest

      - name: Run Python tests (advanced)
        working-directory: advanced/samples/python
        run: uv run pytest

      - name: Run Java tests (samples)
        working-directory: samples/java
        run: ./gradlew build --no-daemon

      - name: Run Java tests (advanced)
        working-directory: advanced/samples/java
        run: ./gradlew build --no-daemon

      - name: Run .NET tests (samples)
        working-directory: samples/dotnet
        run: dotnet test tests/ --nologo

      - name: Run .NET tests (advanced)
        working-directory: advanced/samples/dotnet
        run: dotnet test tests/ --nologo
