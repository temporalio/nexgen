name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install required tooling
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"

      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Validate Markdown
        run: |
          if ! cargo validate markdown; then
            echo "::error::Markdown formatting check failed. Run \`cargo fmt-markdown\` locally and commit the result."
            exit 1
          fi

      - name: Validate Rust
        run: cargo validate rust

      - name: Validate Python samples
        run: cargo validate python

      - name: Validate TypeScript samples
        run: cargo validate typescript

      - name: Validate Go samples
        run: cargo validate go

      - name: Validate Java samples
        run: cargo validate java

      - name: Validate .NET samples
        run: cargo validate dotnet

      - name: Validate cross-language conformance
        run: cargo validate conformance
