name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  create-draft:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.crate.outputs.tag }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publishing must be run from main; got ${GITHUB_REF}."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6255b92812bf51d292e488b61469267a391267f6 # stable

      - name: Check out shared changelog tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: temporalio/sdk-rust
          ref: 38f831515fb4be0e4e0bbcfe9504d0ffbbb43a0f
          path: .changelog-tool

      - name: Read crate metadata
        id: crate
        run: |
          manifest_path="$(realpath Cargo.toml)"
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          name="$(jq -r --arg manifest_path "$manifest_path" '.packages[] | select(.manifest_path == $manifest_path) | .name' <<<"$metadata")"
          version="$(jq -r --arg manifest_path "$manifest_path" '.packages[] | select(.manifest_path == $manifest_path) | .version' <<<"$metadata")"

          if [[ -z "$name" || "$name" == "null" || -z "$version" || "$version" == "null" ]]; then
            echo "failed to read package name/version from cargo metadata"
            exit 1
          fi

          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=v$version"
          } >>"$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.crate.outputs.tag }}
          RELEASE_TITLE: ${{ steps.crate.outputs.name }} ${{ steps.crate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          cargo run --quiet \
            --manifest-path .changelog-tool/crates/changelog-release-notes/Cargo.toml \
            --bin changelog-tool -- notes --repo "$GITHUB_WORKSPACE" \
            --version "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  attach-binaries:
    name: Attach release binaries
    needs: create-draft
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.create-draft.outputs.tag }}

  publish:
    name: Publish crate
    needs: attach-binaries
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6255b92812bf51d292e488b61469267a391267f6 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
