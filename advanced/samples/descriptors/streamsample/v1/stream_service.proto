// A small stream service for the stream-service sample, shaped like the Temporal stream service.
syntax = "proto3";

package streamsample.v1;

option csharp_namespace = "StreamSample.V1";

import "google/protobuf/duration.proto";
import "temporal/api/common/v1/message.proto";

message StreamRef {
    string id = 1;
    string workflow_id = 2;
}

message AppendRecord {
    string topic = 1;
    temporal.api.common.v1.Payload body = 2;
}

message StreamRecord {
    int64 offset = 1;
    string topic = 2;
    temporal.api.common.v1.Payload body = 3;
}

message CreateStreamRequest {
    string namespace = 1;
    StreamRef ref = 2;
    google.protobuf.Duration retention = 3;
}

message CreateStreamResponse {
    StreamRef stream = 1;
    bool created = 2;
}

message AppendRecordsRequest {
    string namespace = 1;
    StreamRef stream = 2;
    int64 sequence = 3;
    repeated AppendRecord records = 4;
}

message AppendRecordsResponse {
    int64 first_offset = 1;
    int64 last_offset = 2;
}

message CloseStreamRequest {
    string namespace = 1;
    StreamRef stream = 2;
    temporal.api.common.v1.Payload result = 3;
}

message CloseStreamResponse {
}

message ReadRecordsRequest {
    string namespace = 1;
    StreamRef stream = 2;
    int64 from_offset = 3;
    repeated string topics = 4;
    int32 max_records = 5;
    google.protobuf.Duration wait = 6;
}

message ReadRecordsResponse {
    repeated StreamRecord records = 1;
    int64 next_offset = 2;
    bool done = 3;
}

message DescribeStreamRequest {
    string namespace = 1;
    StreamRef stream = 2;
}

message DescribeStreamResponse {
    int64 last_offset = 1;
    google.protobuf.Duration retention = 2;
}
