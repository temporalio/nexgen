[project]
name = "advanced-samples-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "basedpyright==1.31.4",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.12",
    "temporalio>=1.32.0",
    "typing_extensions>=4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.basedpyright]
exclude = [".venv"]
ignore = ["wit/notification_service/models.py"]
reportAny = false
reportExplicitAny = false
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnnecessaryTypeIgnoreComment = "error"
