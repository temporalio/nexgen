[project]
name = "advanced-samples-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "basedpyright==1.31.4",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.12",
    "temporalio>=1.34.0",
    "temporalio-stream-protos",
    "typing_extensions>=4.15.0",
]

[tool.uv]
package = false
exclude-newer = "2 weeks"

[tool.uv.sources]
# Keep it non-editable. An editable install adds a path entry, and Python ignores that path for
# modules of the installed temporalio package.
temporalio-stream-protos = { path = "temporalio_stream_protos" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"
# The protoc output of the stream protos.
extend-exclude = ["temporalio_stream_protos"]

[tool.basedpyright]
exclude = [".venv", "temporalio_stream_protos"]
reportAny = false
reportExplicitAny = false
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnnecessaryTypeIgnoreComment = "error"
