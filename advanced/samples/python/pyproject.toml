[project]
name = "advanced-samples-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "basedpyright==1.31.4",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.12",
    "temporalio>=1.36.1",
    "typing_extensions>=4.15.0",
]

[tool.uv]
package = false
exclude-newer = "2 weeks"
# The launcher fixes require a newer SDK than the general dependency cooldown.
exclude-newer-package = { temporalio = false }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
[tool.basedpyright]
exclude = [".venv"]
reportAny = false
reportExplicitAny = false
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnnecessaryTypeIgnoreComment = "error"
