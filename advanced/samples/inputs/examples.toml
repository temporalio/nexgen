[workflow-service]
system_nexus = true
descriptors = "temporal"

[multi-operation-service]
system_nexus = true

[generic-models]
descriptors = "temporal"

[start-workflow]
descriptors = "temporal"

[proto-backed-showcase]
descriptors = "temporal"

[proto-generic]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[proto-oneof]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[notification-service]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

# The Stream service WIT of temporalio-streams, on the Stream protos of temporalio/api#895 at
# 44519d8a. Its .NET output builds in Nexgen.DotNetStreamService.csproj. Python also gets the
# client target.
[stream-service]
languages = ["python", "typescript", "dotnet"]
system_nexus = true
targets = ["workflow", "client"]
descriptors = ["temporal_api.bin", "streams.bin"]

# A System Nexus operation that returns a resource.
[workflow-handle]
languages = ["python", "dotnet", "typescript"]
system_nexus = true
descriptors = "temporal"
