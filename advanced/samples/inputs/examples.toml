[workflow-service]
targets = ["workflow"]
system_nexus = true
descriptors = "temporal"

[multi-operation-service]
targets = ["workflow"]
system_nexus = true

[generic-models]
targets = ["workflow"]
descriptors = "temporal"

[start-workflow]
targets = ["workflow"]
descriptors = "temporal"

[proto-backed-showcase]
targets = ["workflow"]
descriptors = "temporal"

[proto-generic]
targets = ["workflow"]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[proto-oneof]
targets = ["workflow"]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[notification-service]
targets = ["workflow"]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

# The Stream service WIT of temporalio-streams, on the Stream protos of temporalio/api#895 at
# 44519d8a. Its .NET output builds in Nexgen.DotNetStreamService.csproj.
[stream-service]
system_nexus = true
descriptors = ["temporal_api.bin", "streams.bin"]

[stream-service.workflow]
languages = ["typescript", "dotnet"]
targets = ["workflow"]

# Only Python has the client target, so its output has both APIs.
[stream-service.both]
languages = ["python"]
targets = ["workflow", "client"]

# A System Nexus operation that returns a resource.
[workflow-handle]
targets = ["workflow"]
languages = ["python", "dotnet", "typescript"]
system_nexus = true
descriptors = "temporal"

[defaults]
targets = ["workflow"]

[function-execution]
targets = ["workflow"]

[user-service]
targets = ["workflow"]

[type-showcase]
targets = ["workflow"]

# A resource that another interface returns, for the Python client target.
[cross-service-resource]
languages = ["python"]
targets = ["workflow", "client"]

[target-sources]
descriptors = "temporal"

[target-sources.workflow]
targets = ["workflow"]

[target-sources.client]
languages = ["python"]
targets = ["client"]

[target-sources.both]
languages = ["python"]
targets = ["workflow", "client"]
