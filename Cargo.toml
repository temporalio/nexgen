[package]
name = "nexgen"
version = "0.2.5"
edition = "2024"
description = "Generate language-specific Nexus operation bindings from WIT"
license = "MIT"
repository = "https://github.com/temporalio/nexgen"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/src/**",
    # Pinned RFC 3986 URI grammar bodies pulled in by src/json_schema/format.rs
    # via include_str!; required for the crate to compile from the tarball.
    "/specs/json-schema/corpora/format_uri/*.body",
]

[workspace]
members = ["xtask"]
resolver = "2"

[[bin]]
name = "nexgen"
path = "src/main.rs"

[features]
# Exposes the CLI surface that is not covered by README.md: the `dotnet`
# generate target, the WIT/proto-oriented generate flags (`--support-file`,
# `--descriptors`, `--format`, `--native-api`), and the maintenance subcommands
# (`add-rpc`, `add-message`, `debug-wit-dir`). See advanced/README.md. Off by
# default so the published binary only offers the documented JSON Schema workflow.
advanced = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
heck = "0.5"
indexmap = { version = "2.7", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
regex = "1.13"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = "3.23"
thiserror = "2.0"
wit_parser_crate = { package = "wit-parser", version = "0.252" }
