# This is the feature-coverage showcase for the JSON-Schema generator: a single
# cohesive schema that exercises the whole currently-supported keyword subset so
# that future keyword work lands with round-trip coverage in all four languages.
# It also carries a minimal `nexusrpc` service/operation so the showcase is
# exercised as a Nexus JSON schema document, not just a definitions bucket.
#
# It is additionally the single home for the per-language identifier overrides
# (the Stage 4 `x-<lang>-name` escape hatch and its `x-<lang>-const-name` /
# `x-<lang>-enum-names` siblings). Every override *kind* is exercised here —
# service name, operation name, model name, property name, const name, and enum
# names. To keep the schema free of invented nouns, each override value is just
# the derived name plus a per-language suffix (`Go` / `Ts` / `Py` / `Java`, or
# `_JAVA` for a Java constant) — a **different value per language** so a
# round-trip that reads the wrong language's key is caught: the emitted
# identifier proves which key was consulted. Wire names (`fqn`, JSON property
# keys, enum values) are never affected by any of these overrides.
nexusrpc: "1.0.0"
$schema: https://json-schema.org/draft/2020-12/schema
description: The feature-coverage showcase service for the JSON-Schema generator.
services:
  ShowcaseService:
    fqn: example.showcase.v1.ShowcaseService
    description: >-
      Fetch the showcase payload. Also exercises the service-level
      `x-<lang>-name` override: the emitted service code identifier is renamed
      to the derived name plus a per-language suffix (Go var
      `ShowcaseServiceGo`, TS const `showcaseServiceTs`, Python class
      `ShowcaseServicePy`, Java interface `ShowcaseServiceJava`, C# interface
      `IShowcaseServiceCs`) while the wire
      service name / `@Service` / `ServiceName` string stays
      `example.showcase.v1.ShowcaseService`.
    x-go-name: ShowcaseServiceGo
    x-ts-name: showcaseServiceTs
    x-py-name: ShowcaseServicePy
    x-java-name: ShowcaseServiceJava
    x-cs-name: ShowcaseServiceCs
    operations:
      getShowcase:
        description: >-
          Fetch a showcase by id. Also exercises the operation-level
          `x-<lang>-name` override: the emitted operation code identifier is
          renamed to the derived name plus a per-language suffix (Go
          `GetShowcaseGo`, TS `getShowcaseTs`, Python `get_showcase_py`, Java
          `getShowcaseJava`, C# `GetShowcaseCs`) while the wire operation name
          stays `GetShowcase`
          and the synthesized I/O type stays `GetShowcaseInput` (derived from
          the operation key, not the override).
        x-go-name: GetShowcaseGo
        x-ts-name: getShowcaseTs
        x-py-name: get_showcase_py
        x-java-name: getShowcaseJava
        x-cs-name: GetShowcaseCs
        input:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
          required: [id]
        output: { $ref: "#/$defs/Showcase" }
$defs:
  Showcase:
    title: Showcase
    description: >-
      Root object exercising the supported JSON-Schema feature subset: required and
      optional fields of every scalar type, optional+nullable and required+nullable
      members, arrays, a nested object via $ref, a typed-map, a closed object, an
      open (catch-all) object, a string const, a scalar default, and member docs.
    type: object
    additionalProperties: false
    properties:
      kind:
        description: Discriminator; always "showcase".
        type: string
        const: showcase
      revision:
        description: >-
          Integer const; always 1. Also exercises the single-`const` value
          override: `x-go-const-name`/`x-java-const-name`/`x-cs-const-name`
          rename the emitted
          constant to the derived name plus a per-language suffix (Go
          `RevisionGo`, Java `REVISION_JAVA`, C# `RevisionCs`) while the wire
          value stays `1`.
          TS/Python are inert here (no const override keyword — the value is
          emitted as a plain literal type).
        type: integer
        const: 1
        x-go-const-name: RevisionGo
        x-java-const-name: REVISION_JAVA
        x-cs-const-name: RevisionCs
      enabled:
        description: Boolean const; always true.
        type: boolean
        const: true
      status:
        description: >-
          Closed string value set. Also exercises the enum value-constant
          override: `x-go-enum-names`/`x-java-enum-names`/`x-cs-enum-names`
          rename the `active`
          value's emitted constant to the value name plus a per-language suffix
          (Go `ActiveGo`, Java `ACTIVE_JAVA`, C# `ActiveCs`) while the wire value
          stays
          `active`. TS/Python are inert here (no enum override keyword).
        type: string
        enum: [active, inactive, pending]
        x-go-enum-names: { active: ActiveGo }
        x-java-enum-names: { active: ACTIVE_JAVA }
        x-cs-enum-names: { active: ActiveCs }
      tier:
        description: Closed integer value set.
        type: integer
        enum: [1, 2, 3]
      scale:
        description: >-
          Closed number value set (exercises the Python float exception: emitted as
          plain float, validated by membership).
        type: number
        enum: [1.5, 2.5]
      name:
        title: Display name
        description: Required human-readable name, 1 to 64 code points.
        type: string
        minLength: 1
        maxLength: 64
      count:
        description: Required integer scalar.
        type: integer
      active:
        description: Required boolean scalar.
        type: boolean
      nickname:
        description: Optional short name, at most 12 code points.
        type: string
        maxLength: 12
      code:
        description: >-
          Optional code, 2 to 5 code points. Counted in Unicode code points, so a
          multi-byte value (e.g. "a😀b", 3 code points / 6 UTF-8 bytes) is valid.
        type: string
        minLength: 2
        maxLength: 5
      sku:
        description: >-
          Optional product code: 2 to 4 uppercase ASCII letters, anchored
          (`^[A-Z]{2,4}$`). Exercises the RE2-safe `pattern` gate.
        type: string
        pattern: "^[A-Z]{2,4}$"
      phrase:
        description: >-
          Optional two-word phrase separated by whitespace (`^\S+\s\S+$`).
          Exercises the loader's `\s`/`\S` → ASCII-class normalization and the
          per-target `$` end-anchor rewrite (Python `\Z` / Java `\z`), so a
          Unicode space (NBSP) and a trailing newline are rejected consistently
          across all four languages.
        type: string
        pattern: "^\\S+\\s\\S+$"
      requestId:
        description: >-
          Optional request identifier; asserted RFC 4122 UUID via `format: uuid`.
          Stays `string`-typed (format assertion, no materialization); the pinned
          regex is validated identically across all four languages.
        type: string
        format: uuid
      contactEmail:
        description: >-
          Optional contact address; asserted ASCII dot-atom `format: email`
          (single `@`, >=2-label domain, total length <= 254, guard-before-regex).
        type: string
        format: email
      host:
        description: >-
          Optional host name; asserted RFC 1123 `format: hostname` (LDH labels,
          total length <= 253).
        type: string
        format: hostname
      homepage:
        description: >-
          Optional homepage; asserted RFC 3986 `format: uri` (scheme required, ASCII
          only; an IP-literal host is validated by the spliced ipv6 grammar).
        type: string
        format: uri
      gateway:
        description: Optional gateway address; asserted dotted-quad IPv4 via format ipv4.
        type: string
        format: ipv4
      blob:
        description: >-
          Optional binary payload carried as a `contentEncoding: base64` string,
          materialized to native bytes (Go []byte, TS Uint8Array, Python bytes, Java
          byte[]). The wire is canonical padded standard base64; a malformed value is
          rejected by the pinned regex before decode.
        type: string
        contentEncoding: base64
      urlBlob:
        description: >-
          Optional binary payload carried as a `contentEncoding: base64url` string
          (URL-safe alphabet, unpadded, RFC 4648 §5), materialized to the same native
          bytes type. The same bytes encode to a different wire than base64
          ("Pj4+" vs "Pj4-").
        type: string
        contentEncoding: base64url
      retries:
        title: Retry budget
        description: Optional integer with a schema default.
        type: integer
        default: 3
      verbose:
        type: boolean
      greeting:
        title: Greeting
        description: Optional string with a schema default, surfaced on read.
        type: string
        default: hello
      debug:
        title: Debug flag
        description: Optional boolean with a schema default.
        type: boolean
        default: false
      legacyId:
        description: >-
          Deprecated legacy identifier; prefer `requestId`. Exercises the native
          deprecation marker (Go // Deprecated:, TS @deprecated, Java @Deprecated,
          Python PEP 702 @deprecated, C# [Obsolete]). Also exercises the property-level
          `x-<lang>-name` override (the Stage 4 escape hatch): the emitted member
          identifier is renamed to the derived name plus a per-language suffix
          (Go `LegacyIdGo`, TS `legacyIdTs`, Python `legacy_id_py`, Java
          `legacyIdJava`, C# `LegacyIdCs`) while the wire name stays `legacyId`
          (json tag / alias
          / @JsonProperty).
        deprecated: true
        type: string
        x-go-name: LegacyIdGo
        x-ts-name: legacyIdTs
        x-java-name: legacyIdJava
        x-cs-name: LegacyIdCs
        x-py-name: legacy_id_py
      middleName:
        description: Optional and nullable; may be absent or explicitly null.
        oneOf:
          - { type: string }
          - { type: "null" }
      category:
        description: Required but nullable; may be explicitly cleared to null.
        oneOf:
          - { type: string }
          - { type: "null" }
      priority:
        description: Optional integer bounded to the inclusive range [1, 10].
        type: integer
        minimum: 1
        maximum: 10
      level:
        description: Optional integer that must be strictly greater than 0.
        type: integer
        exclusiveMinimum: 0
      ratio:
        description: Optional number that must be a non-negative multiple of 5.
        type: number
        minimum: 5
        multipleOf: 5
      score:
        description: Optional unbounded finite number.
        type: number
      step:
        description: Optional integer that must be a multiple of 3.
        type: integer
        multipleOf: 3
      tags:
        description: Ordered list of free-form tags; 1 to 5 entries.
        type: array
        items: { type: string }
        minItems: 1
        maxItems: 5
      aliases:
        description: Alternate names; each must be distinct.
        type: array
        items: { type: string }
        uniqueItems: true
      roles:
        description: >-
          Access roles; must contain between one and two "admin" entries.
        type: array
        items: { type: string }
        contains: { const: admin }
        minContains: 1
        maxContains: 2
      idOrName:
        description: >-
          Disjoint-kind union (oneOf sum type): the wire value is either a string of
          at least 3 code points or an integer of at least 1, selected by its JSON
          token. Not a member of a discriminated union — the token itself is the
          selector. Each branch also carries its **own constraints**: once the token
          selects a branch, the value is held to everything that branch declares, in
          both directions, with the union's path on the violation.
        oneOf:
          - { type: string, minLength: 3 }
          - { type: integer, minimum: 1 }
      mode:
        description: >-
          A union whose string branch is a **closed value set**: either one of two
          named modes or an unbounded non-negative integer. The branch narrows to
          its own admissible values (a Go/Java membership check, a TypeScript
          literal union, a Python `Literal`), so an unknown string is a Violation
          while any non-negative integer is accepted.
        oneOf:
          - { type: string, enum: [auto, manual] }
          - { type: integer, minimum: 0 }
      payload:
        description: >-
          Mixed-kind union whose object branch is an inline free-form object: the
          wire value is either an arbitrary object (members carried verbatim) or
          a string, selected by its JSON token. The free-form object is the one
          object branch that needs no type name — TypeScript and Python carry it
          structurally, Go and Java wrap it as `<Union>Object`.
        oneOf:
          - { type: object, additionalProperties: true }
          - { type: string }
      detail:
        description: >-
          Mixed-kind union whose object branch is an inline *structured* object,
          written directly on the property rather than in `$defs`. It is the only
          object branch of this union, so it derives its name from the union it
          belongs to — `ShowcaseDetailObject` — and is emitted as an ordinary
          model: its members keep their own constraints and it stays open to
          unknown ones.
        oneOf:
          - type: object
            required: [code]
            properties:
              code: { type: string, minLength: 1 }
              hint: { type: string }
          - { type: string }
      shapeOrName:
        description: >-
          Tagged object union mixed with a scalar kind: the two selector layers
          compose — the JSON token picks object-vs-string, and, for an object,
          the shared required `kind` const picks Circle-vs-Square. Written
          inline on the property, so the union itself is named after its
          position (`ShowcaseShapeOrName` / nested `Showcase.ShapeOrName`), and
          it reuses the `Circle`/`Square` branches of `shape` — a branch type
          may belong to more than one union (Go gains a second marker method,
          Java a second implemented interface). The scalar branch carries a
          length bound of its own; the object branches validate through their
          own models.
        oneOf:
          - { $ref: "#/$defs/Circle" }
          - { $ref: "#/$defs/Square" }
          - { type: string, maxLength: 32 }
      measurements:
        description: >-
          Mixed-kind union with an array branch: the wire value is either a
          non-empty list of distinct numbers or a lowercase preset name, selected
          by its JSON token. An array branch has no definition to take a name
          from, so Go and Java emit it as the synthesized `<Union>Array` variant
          (a defined type / a `@JsonValue` wrapper) while TypeScript and Python
          carry it structurally as `number[]` / `list[float]`. Both branches
          carry their own constraints — the array's `minItems`/`uniqueItems` and
          the string's `pattern` — so the array-vs-string choice is validated as
          well as selected.
        oneOf:
          - { type: array, items: { type: number }, minItems: 1, uniqueItems: true }
          - { type: string, pattern: "^[a-z]+$" }
      shapes:
        description: >-
          A list whose element type is a named union: every element is routed to
          exactly one branch by the union's own selector, and its index carries
          into the violation path (`shapes[1]`). Go and Java cannot decode a
          sealed interface as a whole, so the element decodes through the
          union's dispatcher one at a time.
        type: array
        items: { $ref: "#/$defs/Shape" }
      segments:
        description: >-
          A list whose element union is written **inline**. An element has no
          name of its own, so the union is named after its position —
          `ShowcaseSegmentsItem` — moved into `$defs`, and the element becomes a
          `$ref` at it; from there it is an ordinary named union in every
          language.
        type: array
        items:
          oneOf:
            - { type: string, minLength: 2 }
            - { type: integer, minimum: 0 }
      slots:
        description: >-
          A list of **nullable, constrained scalar elements** — the two-branch
          nullability `oneOf` rather than a sum type, so nothing is named: the
          elements themselves become nullable (`[]*string`, `(string | null)[]`,
          `list[str | None]`, `List<@Nullable String>`) while each present string
          retains its own minimum length and the list stays a list.
        type: array
        items:
          oneOf:
            - { type: string, minLength: 2 }
            - { type: "null" }
      grid:
        description: >-
          A nested array: `items` at depth two. Each level decodes elementwise, so
          a bad element is reported at its own two-dimensional index
          (`grid[1][0]`).
        type: array
        items:
          type: array
          items: { type: integer }
      numberGrid:
        description: >-
          A nested array of numbers used to prove recursive finite-number
          validation and two-dimensional indexed aggregation.
        type: array
        items:
          type: array
          items: { type: number }
      links:
        description: A list of scalar URI values; every element keeps its format assertion.
        type: array
        items: { type: string, format: uri }
      addresses:
        description: A list of referenced models, converted and validated elementwise.
        type: array
        items: { $ref: "#/$defs/Address" }
      addressBook:
        $ref: "#/$defs/AddressBook"
      dates:
        description: Materialized calendar dates in an array.
        type: array
        items: { type: string, format: date }
      dateIndex:
        $ref: "#/$defs/DateIndex"
      blobs:
        description: Materialized base64 byte strings in an array.
        type: array
        items: { type: string, contentEncoding: base64 }
      blobIndex:
        $ref: "#/$defs/BlobIndex"
      metrics:
        $ref: "#/$defs/Metrics"
      metricOrLabel:
        description: A finite number branch or a non-empty string branch.
        oneOf:
          - { type: number }
          - { type: string, minLength: 1 }
      addressListOrLabel:
        description: >-
          A union whose array branch contains referenced models, proving that
          branch conversion uses the ordinary recursive array mapper.
        oneOf:
          - type: array
            minItems: 1
            items: { $ref: "#/$defs/Address" }
          - { type: string, minLength: 1 }
      location:
        description: >-
          An object written **inline** on the property rather than in `$defs`. It
          is named after the position it occupies — `ShowcaseLocation` — moved
          into `$defs`, and the property becomes a `$ref` at it, so it emits as
          the ordinary named model an authored definition would produce, member
          constraints and all. Its own nested inline object is named against that
          name in turn (`ShowcaseLocationGeo`), so nesting needs no `$defs`
          boilerplate at any depth.
        type: object
        required: [city]
        properties:
          city: { type: string, minLength: 1 }
          geo:
            type: object
            properties:
              lat: { type: number }
              lon: { type: number }
      audit:
        description: >-
          A nullable inline object. The nullability wrapper emits no type of its
          own, so the object inside it takes the property's name —
          `ShowcaseAudit`, the same name it would take written plainly: adding or
          removing nullability never renames the type.
        oneOf:
          - type: object
            required: [by]
            properties:
              by: { type: string, minLength: 1 }
          - { type: "null" }
      rows:
        description: >-
          A list whose element is an inline object, named after its position
          (`ShowcaseRowsItem`) exactly as an inline element *union* is.
        type: array
        items:
          type: object
          required: [cell]
          properties:
            cell: { type: string, minLength: 1 }
      ledger:
        description: >-
          A typed map written inline on the property: the map itself is named
          `ShowcaseLedger` and its inline member shape `ShowcaseLedgerValue`, so
          both the map and its members are ordinary named models. Also exercises
          the member-name override on a hoisted property — `x-<lang>-name` keeps
          naming the *member* (Go `LedgerGo`, TS `ledgerTs`, Python `ledger_py`,
          Java `ledgerJava`, C# `LedgerCs`) while the type keeps its
          position-derived name.
        type: object
        additionalProperties:
          type: object
          required: [amount]
          properties:
            amount: { type: integer, minimum: 0 }
        x-go-name: LedgerGo
        x-ts-name: ledgerTs
        x-py-name: ledger_py
        x-java-name: ledgerJava
        x-cs-name: LedgerCs
      metadata:
        description: >-
          A free-form object written inline. Even this is named
          (`ShowcaseMetadata`): every object emits as a named aggregate holding
          its members in a catch-all, so adding `properties` to it later only
          adds fields rather than changing the emitted type's kind, and its
          member-count bound rides along with it.
        type: object
        additionalProperties: true
        maxProperties: 3
      quotas:
        $ref: "#/$defs/Quotas"
      tokens:
        $ref: "#/$defs/Tokens"
      nicknames:
        $ref: "#/$defs/Nicknames"
      choices:
        $ref: "#/$defs/Choices"
      extras:
        $ref: "#/$defs/Extras"
      shape:
        $ref: "#/$defs/Shape"
      note:
        $ref: "#/$defs/Note"
      address:
        $ref: "#/$defs/Address"
      labels:
        $ref: "#/$defs/Labels"
      settings:
        $ref: "#/$defs/Settings"
      attributes:
        $ref: "#/$defs/Attributes"
      contact:
        $ref: "#/$defs/Contact"
      nullableCount:
        description: >-
          Optional and nullable **integer**, with bounds on the non-null branch.
          The nullability wrapper carries no `type` of its own, so an emitter that
          reads the wrapper rather than the branch loses both the element type and
          every constraint on it. Go emits `*int64`, TS `number | null`, Python
          `int | None`, Java `@Nullable Long`, and `1 <= v <= 10` is enforced in
          all four, in both directions.
        oneOf:
          - { type: integer, minimum: 1, maximum: 10 }
          - { type: "null" }
      nullableRatio:
        description: Optional and nullable number with a divisor on the non-null branch.
        oneOf:
          - { type: number, multipleOf: 2 }
          - { type: "null" }
      nullableFlag:
        description: Optional and nullable boolean.
        oneOf:
          - { type: boolean }
          - { type: "null" }
      nullableTags:
        description: >-
          Optional and nullable **array**, with element and count constraints on
          the non-null branch. Optional + nullable, so the Go field stays `[]string`
          and a wire `null` decodes to a nil slice.
        oneOf:
          - { type: array, items: { type: string }, minItems: 1, uniqueItems: true }
          - { type: "null" }
      nullableMode:
        description: >-
          Optional and nullable **closed value set** — the closed type survives the
          nullability wrapper, so an unknown string is a Violation rather than an
          accepted value.
        oneOf:
          - { type: string, enum: [auto, manual] }
          - { type: "null" }
      integralMeasurements:
        description: >-
          An integer `contains` matcher over number elements: the matcher's own
          predicate decides a match, and the +/-(2^53-1) integer cap applies to it
          in every language.
        type: array
        items: { type: number }
        contains: { type: integer }
      byFive:
        description: >-
          A number-field divisor. Divisibility is IEEE `fmod` over the stored
          binary64 value, not exact decimal arithmetic, so all four agree at
          magnitudes where the shortest decimal spelling and the stored double
          diverge.
        type: number
        multipleOf: 5
      wildcard:
        description: >-
          A pattern containing a bare dot, normalized to an explicit negated class
          so the four regex engines agree on line terminators (`\r`, U+0085,
          U+2028, U+2029), which their native `.` does not.
        type: string
        pattern: "a.b"
      quoted:
        description: 'Ends with a quote "'
        type: string
    required: [kind, revision, enabled, status, tier, scale, name, count, active, category]
  Circle:
    description: A circle branch of the Shape and shapeOrName tagged unions.
    type: object
    required: [kind, radius]
    properties:
      kind: { type: string, const: circle }
      radius: { type: number }
  Square:
    description: A square branch of the Shape and shapeOrName tagged unions.
    type: object
    required: [kind, side]
    properties:
      kind: { type: string, const: square }
      side: { type: number }
  Shape:
    description: >-
      A closed sum type (discriminated union) of Circle | Square, tagged by the
      shared required `kind` const. Selection reads `kind` and routes to the
      matching branch; an unknown tag is a Violation.
    oneOf:
      - { $ref: "#/$defs/Circle" }
      - { $ref: "#/$defs/Square" }
  Note:
    description: >-
      A tagged union whose object branches are written **inline** rather than
      `$ref`ed: each branch is emitted as a named type, so each names itself with
      the per-language `x-<lang>-name` override (two or more inline object
      branches cannot derive distinguishing names — the discriminator `const` is
      a wire value, not an identifier). Selection reads the shared required
      `kind` const, and each branch keeps its own constraints and stays open to
      unknown members.
    oneOf:
      - type: object
        description: A text note branch, named inline.
        required: [kind, body]
        properties:
          kind: { type: string, const: text }
          body: { type: string, minLength: 1 }
        x-go-name: TextNote
        x-ts-name: TextNote
        x-py-name: TextNote
        x-java-name: TextNote
        x-cs-name: TextNote
      - type: object
        description: A link note branch, named inline.
        required: [kind, href]
        properties:
          kind: { type: string, const: link }
          href: { type: string, minLength: 1 }
        x-go-name: LinkNote
        x-ts-name: LinkNote
        x-py-name: LinkNote
        x-java-name: LinkNote
        x-cs-name: LinkNote
  Address:
    description: A nested object, open to forward-compatible extension.
    type: object
    properties:
      street: { type: string }
      city: { type: string }
      zip: { type: integer }
    required: [street]
  AddressBook:
    description: A typed map of referenced Address models.
    type: object
    additionalProperties: { $ref: "#/$defs/Address" }
  DateIndex:
    description: A typed map of materialized calendar dates.
    type: object
    additionalProperties: { type: string, format: date }
  BlobIndex:
    description: A typed map of materialized base64 byte strings.
    type: object
    additionalProperties: { type: string, contentEncoding: base64 }
  ItemRules:
    description: >-
      Closed array elements are enforced before the array-level predicates, so
      indexed violations precede minItems and uniqueItems deterministically.
    type: object
    additionalProperties: false
    required: [values]
    properties:
      values:
        type: array
        minItems: 3
        uniqueItems: true
        items: { type: string, const: fixed }
  Metrics:
    description: A typed map of finite numbers.
    type: object
    additionalProperties: { type: number }
  Labels:
    description: Arbitrary string key/value labels (typed map).
    type: object
    additionalProperties: { type: string }
    maxProperties: 50
  Quotas:
    description: >-
      A typed map whose members carry their own constraints: every member is a
      non-negative multiple of 5, at most 100. A member is held to exactly what a
      declared field of that type is held to, in both directions, with the
      offending member's key as the violation path.
    type: object
    additionalProperties:
      type: integer
      minimum: 0
      maximum: 100
      multipleOf: 5
  Tokens:
    description: >-
      A typed map with a refined *string* member: 2 to 8 code points of lowercase
      ASCII. Exercises the member-level `minLength`/`maxLength`/`pattern` in every
      language.
    type: object
    additionalProperties:
      type: string
      minLength: 2
      maxLength: 8
      pattern: "^[a-z]+$"
  Nicknames:
    description: >-
      A typed map of **nullable** members: a member may be an explicit null,
      which is kept as a null member rather than dropped from the map, while a
      present member still carries its own constraint.
    type: object
    additionalProperties:
      oneOf:
        - { type: string, minLength: 2 }
        - { type: "null" }
  Choices:
    description: >-
      A map whose *member* type is a union written inline in
      `additionalProperties`. Like an element union it has no name of its own,
      so it is named after its position — `ChoicesValue` — and moved into
      `$defs`; each member then decodes through that union's selector, with the
      member key carrying into the violation path.
    type: object
    additionalProperties:
      oneOf:
        - { $ref: "#/$defs/Circle" }
        - { $ref: "#/$defs/Square" }
  Extras:
    description: >-
      A free-form object (`additionalProperties: true` with no declared
      properties): every member is carried verbatim, bounded to at most 4
      members. Members keep their wire form, so large integers survive a
      round-trip untruncated.
    type: object
    additionalProperties: true
    maxProperties: 4
  Settings:
    description: A closed object; unknown members are rejected.
    type: object
    additionalProperties: false
    properties:
      theme: { type: string }
      fontSize: { type: integer }
  Attributes:
    description: >-
      A string map with member-count and key-shape constraints: 1 to 3 entries,
      each key at most 8 code points (minProperties/maxProperties/propertyNames
      on a map-shaped object).
    type: object
    additionalProperties: { type: string }
    minProperties: 1
    maxProperties: 3
    propertyNames:
      type: string
      maxLength: 8
  Contact:
    description: >-
      Contact details with a conditional requirement and a member-count bound:
      a shipping street requires a shipping zip (dependentRequired), and the
      object must carry 1 to 3 members (minProperties/maxProperties on a
      declared-property object). Also exercises the type-level `x-<lang>-name`
      override (the Stage 4 escape hatch): the emitted type is renamed to the
      derived name plus a per-language suffix (Go `ContactGo`, TS `ContactTs`,
      Python `ContactPy`, Java `ContactJava`, C# `ContactCs`) at its
      declaration and at every
      `$ref`, while the wire `$ref` name stays `Contact`.
    x-go-name: ContactGo
    x-ts-name: ContactTs
    x-py-name: ContactPy
    x-java-name: ContactJava
    x-cs-name: ContactCs
    type: object
    minProperties: 1
    maxProperties: 3
    properties:
      email: { type: string }
      shippingStreet: { type: string }
      shippingZip: { type: string }
    dependentRequired:
      shippingStreet: [shippingZip]
  WidgetBase:
    description: >-
      A base object folded into Widget via allOf. It stays its own type; Widget
      copies its fields rather than referencing or subtyping it.
    type: object
    required: [id]
    properties:
      id: { type: string }
      kind: { type: string }
  Widget:
    description: >-
      Base-type extension via allOf: WidgetBase is flattened in and the
      extension branch adds fields, so Widget merges to one standalone object
      with the union of properties ({id, kind, name, size}) and required
      ([id, name]). The `size` member is itself an allOf that tightens two
      numeric bounds to a single interval [10, 20]; a value outside it is
      rejected by the merged constraint. No allOf survives past the loader.
    allOf:
      - { $ref: "#/$defs/WidgetBase" }
      - type: object
        required: [name]
        properties:
          name: { type: string }
          size:
            description: >-
              Optional integer with two allOf branches tightened to [10, 20].
            allOf:
              - { type: integer, minimum: 0, maximum: 100 }
              - { type: integer, minimum: 10, maximum: 20 }
